name: Generar App Windows (.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v3

    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restaurar Dependencias
      run: dotnet restore AppWindows/AppWindows.csproj

    - name: Compilar y Empaquetar
      run: dotnet publish AppWindows/AppWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

    - name: Subir Archivo .exe
      uses: actions/upload-artifact@v4
      with:
        name: EmisorApp-Windows
        path: out/AppWindows.exe
