name: Build Electron Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install
      working-directory: ./windows-app

    - name: Build Electron App (Portable)
      run: npx electron-builder --win portable
      working-directory: ./windows-app
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Portable EXE
      uses: actions/upload-artifact@v4
      with:
        name: EmisorCasaCambio-Windows
        path: windows-app/dist/EmisorCasaCambio.exe
