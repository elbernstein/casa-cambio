name: Build Electron Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install > install_log.txt 2>&1
      working-directory: ./windows-app
      continue-on-error: true

    - name: Build Electron App
      run: npm run dist > build_log.txt 2>&1
      working-directory: ./windows-app
      continue-on-error: true

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          windows-app/install_log.txt
          windows-app/build_log.txt
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CasaCambio-Widget-Windows
        path: windows-app/dist/*.exe
